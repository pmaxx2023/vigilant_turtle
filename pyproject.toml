[project]
name = "vigilant-turtle"
version = "0.1.0"
description = "Finds eBay arbitrage opportunities by detecting listings priced significantly below the median for a keyword."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.scripts]
vt = "vigilant_turtle.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilant_turtle"]
